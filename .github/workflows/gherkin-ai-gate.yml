name: Gherkin-AI Enterprise Quality Gate

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  ghk-governance:
    runs-on: ubuntu-latest
    env:
      GHK_NON_INTERACTIVE: 'true'
      # Pinned on purpose: a quality gate must not change behavior when a new version is published.
      GHK_VERSION: '3.5.0'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install gherkin-ai
        run: |
          npm install -g --no-fund --no-audit "gherkin-ai@$GHK_VERSION"

      - name: Run Gherkin Specification Linting
        run: ghk lint --threshold 85 --json > ghk-lint.json

      - name: Measure Specification Convergence
        run: ghk converge --threshold 80 --json > ghk-converge.json

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gherkin-ai-reports
          path: ghk-*.json
